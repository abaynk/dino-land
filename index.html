<meta property="og:description" content="A bilingual English and Russian dinosaur picture book for little kids: 20 cartoon dinosaurs, read-aloud facts, roars and simple games.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">

<style>
/* Layout: a sticker book. Chunky outlined cards on a fern-green page; each dinosaur gets its own little scene. */
:root {
  --bg: #EDF4E2;
  --surface: #FFFDF6;
  --ink: #1F2A1C;
  --muted: #56644E;
  --edge: #22301F;
  --shadow: #22301F;
  --leaf: #3B8A45;
  --leaf-soft: #D3E9C6;
  --on-leaf: #FFFFFF;
  --sun: #FFC43B;
  --sun-soft: #FFEDB8;
  --lava: #EE6034;
  --on-lava: #FFFFFF;
  --land: #E2EFC4;
  --sea: #CFEAF5;
  --sky: #DFEFFA;
  --pink: #F58CA3;
  --blue: #4DA3D9;
  --scene-sky: #BCE4F4;
  --scene-sky2: #E9F7FB;
  --scene-far: #C4DCA9;
  --scene-hill: #9BCB6A;
  --scene-ground: #86BA55;
  --volcano: #9C8672;
  --smoke: #E4E1DA;
  --cloud: #FFFFFF;
  --sun-disc: #FFD35A;
  --sea-top: #86CBEA;
  --sea-deep: #3B8CC2;
  --sand: #EBD7A4;
  --weed: #3E9E6A;
  --star-off: #D9DFD2;
  --font-display: "RocknRoll One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Nunito", "Segoe UI", system-ui, sans-serif;
  --r-lg: 26px;
  --r-md: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111A13; --surface: #1B271D; --ink: #EDF3E5; --muted: #A5B59E; --edge: #45593F; --shadow: #060A06;
    --leaf: #5DB266; --leaf-soft: #274229; --on-leaf: #0E1A0F; --sun: #F6B82C; --sun-soft: #3F3316; --lava: #F2774D; --on-lava: #1C0C05;
    --land: #223322; --sea: #172D39; --sky: #1D2B3A; --pink: #F07F99; --blue: #5CB0E4;
    --scene-sky: #1B2A4B; --scene-sky2: #2D406A; --scene-far: #25391F; --scene-hill: #2F4E2A; --scene-ground: #3B5E33;
    --volcano: #3D322C; --smoke: #4C4E57; --cloud: #7F8BA6; --sun-disc: #F3EBC6;
    --sea-top: #1F5F88; --sea-deep: #0E3452; --sand: #5E5134; --weed: #2F7550; --star-off: #34412F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111A13; --surface: #1B271D; --ink: #EDF3E5; --muted: #A5B59E; --edge: #45593F; --shadow: #060A06;
  --leaf: #5DB266; --leaf-soft: #274229; --on-leaf: #0E1A0F; --sun: #F6B82C; --sun-soft: #3F3316; --lava: #F2774D; --on-lava: #1C0C05;
  --land: #223322; --sea: #172D39; --sky: #1D2B3A; --pink: #F07F99; --blue: #5CB0E4;
  --scene-sky: #1B2A4B; --scene-sky2: #2D406A; --scene-far: #25391F; --scene-hill: #2F4E2A; --scene-ground: #3B5E33;
  --volcano: #3D322C; --smoke: #4C4E57; --cloud: #7F8BA6; --sun-disc: #F3EBC6;
  --sea-top: #1F5F88; --sea-deep: #0E3452; --sand: #5E5134; --weed: #2F7550; --star-off: #34412F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5; font-weight: 500;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.15; }
svg { display: block; }

/* chunky "sticker" button base */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 0 22px; border-radius: 999px;
  border: 3px solid var(--edge); background: var(--surface); color: var(--ink);
  box-shadow: 0 5px 0 var(--shadow); font-weight: 800; font-size: 18px;
  transition: transform .08s ease, box-shadow .08s ease;
  user-select: none; -webkit-user-select: none;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.btn svg { width: 26px; height: 26px; flex: none; }
.btn-leaf { background: var(--leaf); color: var(--on-leaf); }
.btn-lava { background: var(--lava); color: var(--on-lava); }
.btn-sun { background: var(--sun); color: #2A2208; }
.round { width: 56px; padding: 0; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 3px solid var(--edge);
}
.top-inner {
  max-width: 1180px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; border: 0; background: none; padding: 0; }
.brand .print { width: 36px; height: 36px; color: var(--leaf); flex: none; transform: rotate(-12deg); }
.brand-name { font-family: var(--font-display); font-size: clamp(20px, 5vw, 28px); white-space: nowrap; letter-spacing: .01em; }
.controls { display: flex; align-items: center; gap: 10px; flex: none; }
.lang { display: flex; border: 3px solid var(--edge); border-radius: 999px; box-shadow: 0 4px 0 var(--shadow); overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; min-width: 48px; height: 46px; font-weight: 800; font-size: 17px; letter-spacing: .04em; }
.lang button[aria-pressed="true"] { background: var(--leaf); color: var(--on-leaf); }
.icon-btn { width: 50px; height: 50px; min-height: 0; padding: 0; }
@media (max-width: 380px) { .brand .print { display: none; } }
.icon-btn[aria-pressed="false"] { background: var(--star-off); }

.wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 48px; }

/* tabs */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.tab { min-height: 64px; font-size: 20px; font-family: var(--font-display); font-weight: 400; border-radius: var(--r-md); }
.tab svg { width: 34px; height: 34px; }
.tab[aria-selected="true"] { background: var(--leaf); color: var(--on-leaf); }

/* list view */
.hint { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-family: var(--font-display); font-size: clamp(20px, 4.6vw, 26px); }
.hint .trail { display: flex; gap: 4px; color: var(--leaf); }
.hint .trail svg { width: 20px; height: 20px; }
.hint .trail svg:nth-child(odd) { transform: translateY(5px) rotate(80deg); }
.hint .trail svg:nth-child(even) { transform: rotate(100deg); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.chip { min-height: 48px; padding: 0 16px; font-size: 16px; border-radius: 999px; }
.chip svg { width: 22px; height: 22px; }
.chip[aria-pressed="true"] { background: var(--sun); color: #2A2208; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 16px; }
@media (min-width: 720px) { .grid { grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 20px; } }
.card {
  display: flex; flex-direction: column; padding: 0; overflow: hidden; text-align: left;
  border: 3px solid var(--edge); border-radius: var(--r-lg); background: var(--surface);
  box-shadow: 0 6px 0 var(--shadow); transition: transform .1s ease, box-shadow .1s ease;
}
.card:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--shadow); }
.card-art { background: var(--land); padding: 10px 8px 4px; border-bottom: 3px solid var(--edge); }
.card-art.sea { background: var(--sea); }
.card-art.sky { background: var(--sky); }
.card-art svg { width: 100%; height: auto; }
.card-name { padding: 10px 12px 12px; font-family: var(--font-display); font-size: 18px; line-height: 1.2; min-width: 0; overflow-wrap: break-word; hyphens: manual; }
@media (hover: hover) {
  .card:hover { transform: translateY(-3px); box-shadow: 0 9px 0 var(--shadow); }
  .card:hover .dz-body { animation: wiggle .6s ease-in-out; }
}

/* dinosaur drawing animation */
.dz .dz-body { transform-box: fill-box; transform-origin: 50% 100%; }
.dz .dz-eye { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; animation-delay: var(--bd, 0s); }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(.1); } }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-3deg); } 65% { transform: rotate(2.5deg); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px) scale(1.01, .995); } }
@keyframes roar { 0% { transform: scale(1); } 15% { transform: scale(1.1) rotate(-2deg); } 30% { transform: scale(1.08) rotate(2deg); } 45% { transform: scale(1.1) rotate(-2deg); } 60% { transform: scale(1.07) rotate(1.5deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes swim { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(6px,-5px) rotate(-1.5deg); } }
@keyframes fly { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-8px) scaleY(.94); } }

/* detail view */
.detail-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.counter { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.detail-grid { display: grid; gap: 22px; }
@media (min-width: 900px) {
  .detail-grid { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 32px; align-items: start; }
  .stage-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 86px); }
}
.stage {
  position: relative; overflow: hidden; border: 3px solid var(--edge); border-radius: var(--r-lg);
  box-shadow: 0 6px 0 var(--shadow); aspect-ratio: 4 / 3; max-width: 100%; background: var(--scene-sky);
  touch-action: pan-y;
}
.stage .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage-dino {
  position: absolute; left: 7%; right: 7%; bottom: 6%; border: 0; background: none; padding: 0;
  border-radius: 20px;
}
.stage-dino svg { width: 100%; height: auto; }
.stage-dino.land .dz-body { animation: bob 2.6s ease-in-out infinite; }
.stage-dino.sea { bottom: 16%; }
.stage-dino.sea .dz-body { animation: swim 3.2s ease-in-out infinite; }
.stage-dino.sky { bottom: 22%; }
.stage-dino.sky .dz-body { animation: fly 1.6s ease-in-out infinite; }
.stage-dino.roaring .dz-body { animation: roar .9s ease-in-out; }
.tap-me {
  position: absolute; left: 14px; top: 12px; padding: 6px 14px; border-radius: 999px;
  background: var(--surface); border: 3px solid var(--edge); font-weight: 800; font-size: 15px;
  display: flex; align-items: center; gap: 6px; pointer-events: none;
}
.tap-me svg { width: 18px; height: 18px; color: var(--lava); }
.bubble {
  position: absolute; right: 8%; top: 9%; padding: 10px 18px; border-radius: 26px;
  background: #FFFFFF; color: #1F2A1C; border: 3px solid var(--edge);
  font-family: var(--font-display); font-size: clamp(22px, 5.5vw, 34px); letter-spacing: .02em;
  transform-origin: 20% 100%; animation: pop .35s cubic-bezier(.2,1.6,.4,1) both; pointer-events: none;
}
.bubble::after { content: ""; position: absolute; left: 22px; bottom: -14px; width: 18px; height: 18px; background: #FFFFFF; border-right: 3px solid var(--edge); border-bottom: 3px solid var(--edge); transform: rotate(45deg) skew(8deg, 8deg); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.pager { display: flex; align-items: center; gap: 10px; }
.pager .btn { width: 52px; min-height: 52px; height: 52px; }
.pager .btn svg { width: 24px; height: 24px; }

.name-block { margin-top: 18px; }
.dino-name { font-size: clamp(30px, 7.2vw, 46px); overflow-wrap: break-word; }
.dino-name button { all: unset; cursor: pointer; }
.dino-name button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; border-radius: 8px; }
.meaning { margin: 4px 0 0; color: var(--muted); font-size: 18px; font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.actions .btn { flex: 1 1 150px; min-height: 64px; font-size: 20px; }
.actions .btn svg { width: 30px; height: 30px; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px; min-width: 0;
  background: var(--surface); border: 3px solid var(--edge); border-radius: var(--r-md);
}
.stat-ico { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--leaf-soft); color: var(--leaf); }
.stat-ico svg { width: 26px; height: 26px; }
.stat.eats-meat .stat-ico, .stat.eats-fish .stat-ico { background: var(--sun-soft); color: var(--lava); }
.stat-body { min-width: 0; }
.stat-label { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat-value { font-weight: 800; font-size: 18px; line-height: 1.3; overflow-wrap: break-word; }
.stat-sub { font-size: 15px; color: var(--muted); line-height: 1.35; }
@media (max-width: 420px) { .stat { flex-direction: column; gap: 8px; padding: 12px; } }

.panel { margin-top: 18px; padding: 18px; background: var(--surface); border: 3px solid var(--edge); border-radius: var(--r-md); }
.panel h2 { font-size: 22px; margin-bottom: 8px; }
.panel p { margin: 0; }
.kids { display: flex; flex-wrap: wrap; gap: 6px 4px; margin-top: 12px; }
.kids svg { width: 18px; height: 30px; }
.kids svg:nth-child(4n+1) { color: var(--lava); } .kids svg:nth-child(4n+2) { color: var(--blue); }
.kids svg:nth-child(4n+3) { color: var(--sun); } .kids svg:nth-child(4n) { color: var(--pink); }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.facts li { display: flex; gap: 12px; align-items: center; }
.facts .say { width: 48px; height: 48px; min-height: 0; padding: 0; flex: none; box-shadow: 0 4px 0 var(--shadow); }
.facts .say svg { width: 24px; height: 24px; }
.facts span { min-width: 0; font-size: 18px; line-height: 1.4; }

/* games */
.game-menu { display: grid; gap: 18px; }
@media (min-width: 760px) { .game-menu { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.game-tile { display: flex; flex-direction: column; padding: 0; overflow: hidden; text-align: left; border-radius: var(--r-lg); border: 3px solid var(--edge); box-shadow: 0 6px 0 var(--shadow); background: var(--surface); }
.game-tile:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--shadow); }
.game-art { display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding: 14px 12px 8px; background: var(--sun-soft); border-bottom: 3px solid var(--edge); min-height: 150px; }
.game-art svg { width: 44%; height: auto; }
.game-art .ill { width: 30%; }
.game-tile:nth-child(2) .game-art { background: var(--leaf-soft); }
.game-tile:nth-child(3) .game-art { background: var(--sky); }
.game-title { padding: 14px 16px 4px; font-family: var(--font-display); font-size: 23px; }
.game-desc { padding: 0 16px 16px; color: var(--muted); font-size: 16px; }

.play-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.stars { display: flex; gap: 4px; }
.stars svg { width: 34px; height: 34px; color: var(--star-off); }
.stars svg.on { color: var(--sun); animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
.prompt { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.prompt h2 { font-size: clamp(24px, 6vw, 36px); min-width: 0; }
.prompt .btn { flex: none; }
.choices { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choices.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 560px) {
  .choices { gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choices:not(.two) .choice:nth-child(3) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 6px); }
  .choice { border-radius: var(--r-md); } .choice .ch-label { font-size: 18px; }
}
.choice { padding: 0; overflow: hidden; border-radius: var(--r-lg); border: 3px solid var(--edge); box-shadow: 0 6px 0 var(--shadow); background: var(--land); display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; }
.choice:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--shadow); }
.choice.sea { background: var(--sea); } .choice.sky { background: var(--sky); }
.choice .ch-art { padding: 12px 10px 6px; display: flex; align-items: flex-end; justify-content: center; }
.choice .ch-art svg { width: 100%; height: auto; }
.choice .ch-label { background: var(--surface); border-top: 3px solid var(--edge); padding: 10px; font-family: var(--font-display); font-size: 22px; text-align: center; }
.choice.food { background: var(--surface); }
.choice.food .ch-art { background: var(--leaf-soft); min-height: 150px; align-items: center; }
.choice.food.meat .ch-art { background: var(--sun-soft); }
.choice.food .ch-art svg { width: 62%; max-width: 170px; }
.choice.right { background: var(--leaf-soft); border-color: var(--leaf); animation: pop .4s ease; }
.choice.nope { animation: shake .45s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.eat-hero { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; }
.eat-hero .card-art { width: min(100%, 360px); border: 3px solid var(--edge); border-radius: var(--r-lg); box-shadow: 0 6px 0 var(--shadow); }
.big-art { height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.big-art svg { transform-origin: 50% 100%; }
.win { text-align: center; padding: 10px 0 20px; }
.win .dance { width: min(100%, 380px); margin: 0 auto; }
.win .dance .dz-body { animation: roar 1s ease-in-out infinite; }
.win h2 { font-size: clamp(32px, 8vw, 52px); margin: 12px 0 6px; }
.win p { color: var(--muted); font-weight: 700; margin: 0 0 20px; }
.win-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

.foot { margin-top: 36px; color: var(--muted); font-size: 14px; max-width: 65ch; }
.foot.credits { margin-top: 8px; font-size: 13px; }

#confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
#confetti i { position: absolute; top: -20px; width: 12px; height: 16px; border-radius: 3px; animation: fall 1.7s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(var(--rot)); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
<style>
/* page reset (the artifact host supplied this before) */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; min-height: 100vh; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>

<body>
<header class="top">
  <div class="top-inner">
    <button class="brand" id="brand" type="button" aria-label="Home">
      <svg class="print" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-print"/></svg>
      <span class="brand-name" data-t="app">Dino Land</span>
    </button>
    <div class="controls">
      <div class="lang" role="group" aria-label="Language / Язык">
        <button id="lang-en" type="button" data-lang="en" aria-pressed="false">EN</button>
        <button id="lang-ru" type="button" data-lang="ru" aria-pressed="false">РУ</button>
      </div>
      <button id="sound" class="btn icon-btn" type="button" aria-pressed="true"></button>
    </div>
  </div>
</header>

/* ---------- Cartoon dinosaur drawing engine ---------- */
const INK = '#22281f';

function hex2rgb(h){ h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.slice(i,i+2),16)); }
function mix(a,b,t){ const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function fx(n){ return Math.round(n*10)/10; }

function smoothPath(pts, closed = true){
  const n = pts.length;
  let d = 'M' + fx(pts[0][0]) + ' ' + fx(pts[0][1]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++){
    const p0 = pts[closed ? (i-1+n)%n : Math.max(i-1,0)];
    const p1 = pts[i], p2 = pts[(i+1)%n];
    const p3 = pts[closed ? (i+2)%n : Math.min(i+2,n-1)];
    let c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    let c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    if (p1[2]) { c1x = p1[0]; c1y = p1[1]; }
    if (p2[2]) { c2x = p2[0]; c2y = p2[1]; }
    d += ` C${fx(c1x)} ${fx(c1y)} ${fx(c2x)} ${fx(c2y)} ${fx(p2[0])} ${fx(p2[1])}`;
  }
  return closed ? d + 'Z' : d;
}
function polyPath(pts){ return 'M' + pts.map(p => fx(p[0]) + ' ' + fx(p[1])).join(' L') + 'Z'; }

/* biped (theropod-style) leg: hip x/y, foot x, size */
function bleg(hx, hy, fX, s, gy = G){
  return [
    [hx - s*0.95, hy - s*0.2], [hx - s*0.4, hy - s*0.75], [hx + s*0.55, hy - s*0.6],
    [hx + s*0.95, hy + s*0.15], [hx + s*0.45, hy + s*0.85],
    [fX + s*0.2, gy - s*0.8], [fX + s*0.4, gy - s*0.3], [fX + s*0.95, gy - s*0.14],
    [fX + s*1.02, gy, 1], [fX - s*0.45, gy, 1], [fX - s*0.5, gy - s*0.35],
    [fX - s*0.3, gy - s*0.85], [hx - s*0.6, hy + s*0.7]
  ];
}
/* column leg for four-legged dinosaurs */
function cleg(x, top, w, gy = G){
  return [[x - w/2, top], [x + w/2, top], [x + w/2, gy - 10], [x + w/2 + 3, gy, 1], [x - w/2 - 2, gy, 1], [x - w/2, gy - 10]];
}
function nails(x, w, gy = G){
  const r = w * 0.12;
  return [x - w*0.22, x + w*0.1, x + w*0.42].map(nx => ['c', nx, gy - r*0.9, r, 'nail', {sw: 1.8}]);
}
/* back plate / spike: base centre, width, height, tip lean */
function plate(cx, by, w, h, lean = 0){
  return [[cx - w/2, by + 8], [cx - w*0.46, by - h*0.45], [cx + lean, by - h, 1], [cx + w*0.46, by - h*0.45], [cx + w/2, by + 8]];
}
function ring(cx, cy, r, n, bump){
  const pts = [];
  for (let i = 0; i < n; i++){ const a = i/n*Math.PI*2; const rr = r + (i%2 ? bump : 0); pts.push([cx + Math.cos(a)*rr, cy + Math.sin(a)*rr]); }
  return pts;
}

function renderArt(id, opt = {}){
  const a = ART[id]; const c = a.c; const uid = 'a' + (++artSeq);
  const line = mix(c.body, INK, 0.62);
  const pal = {
    body: c.body, belly: c.belly, acc: c.acc || c.body, acc2: c.acc2 || '#FFF1D2',
    line, far: mix(c.body, INK, 0.2), dark: mix(c.body, INK, 0.16),
    nail: '#FFF6E3', white: '#FFFFFF', none: 'none'
  };
  const col = k => (k && k[0] === '#') ? k : (pal[k] || k);
  const paths = {};
  let defs = '', out = '';
  const habitat = a.habitat || 'land';
  if (habitat === 'land' && !opt.noShadow){
    const [cx, rx] = a.sh || [120, 80];
    out += `<ellipse cx="${cx}" cy="${G + 1.5}" rx="${rx}" ry="5" fill="#000" opacity=".13"/>`;
  }
  const attrs = (o, fill, isClip) => {
    let s = ` fill="${col(fill)}"`;
    const noStroke = o.ns || (isClip && !o.stroke);
    if (!noStroke) s += ` stroke="${o.stroke || line}" stroke-width="${o.sw || 3.2}" stroke-linejoin="round" stroke-linecap="round"`;
    if (o.op) s += ` opacity="${o.op}"`;
    if (o.clip) s += ` clip-path="url(#${uid}-${o.clip})"`;
    return s;
  };
  for (const p of a.parts){
    const t = p[0];
    if (t === 'b' || t === 'p'){
      const o = p[3] || {};
      const d = t === 'b' ? smoothPath(p[1]) : polyPath(p[1]);
      if (o.id){ paths[o.id] = d; defs += `<clipPath id="${uid}-${o.id}"><path d="${d}"/></clipPath>`; }
      out += `<path d="${d}"${attrs(o, p[2], !!o.clip)}/>`;
    } else if (t === 'c'){
      const o = p[5] || {};
      out += `<circle cx="${p[1]}" cy="${p[2]}" r="${p[3]}"${attrs(o, p[4], !!o.clip)}/>`;
    } else if (t === 'e'){
      const o = p[6] || {}; const rot = p[7] || 0;
      out += `<ellipse cx="${p[1]}" cy="${p[2]}" rx="${p[3]}" ry="${p[4]}" transform="rotate(${rot} ${p[1]} ${p[2]})"${attrs(o, p[5], !!o.clip)}/>`;
    } else if (t === 'l'){
      const o = p[2] || {};
      out += `<path d="${smoothPath(p[1], false)}" fill="none" stroke="${o.stroke || line}" stroke-width="${o.sw || 2.6}" stroke-linecap="round"${o.clip ? ` clip-path="url(#${uid}-${o.clip})"` : ''}/>`;
    } else if (t === 'o'){
      out += `<path d="${paths[p[1]]}" fill="none" stroke="${line}" stroke-width="3.2" stroke-linejoin="round"/>`;
    } else if (t === 'ck'){
      out += `<circle cx="${p[1]}" cy="${p[2]}" r="${p[3]}" fill="#FF8FA3" opacity=".5"/>`;
    } else if (t === 'eye'){
      const [x, y, r] = [p[1], p[2], p[3]];
      out += `<g class="dz-eye"><circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${line}" stroke-width="2.2"/><circle cx="${fx(x + r*0.22)}" cy="${fx(y + r*0.06)}" r="${fx(r*0.58)}" fill="#1b1d1a"/><circle cx="${fx(x + r*0.42)}" cy="${fx(y - r*0.2)}" r="${fx(r*0.22)}" fill="#fff"/></g>`;
    }
  }
  const label = opt.label ? ` role="img" aria-label="${opt.label}"` : ' aria-hidden="true"';
  return `<svg class="dz" viewBox="0 0 240 170"${label}><defs>${defs}</defs><g class="dz-body">${out}</g></svg>`;
}

if (typeof module !== 'undefined') module.exports = { ART, renderArt, mix };

/* ---------- recorded voice lines (neural TTS, stored as audio packs next to the page) ---------- */
const Voice = (() => {
  const packs = {}, buffers = {};

  const b64 = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };

    const k = lang + '/' + id;
    if (!packs[k]) packs[k] = fetch(`audio/${lang}/${id}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .catch(e => { delete packs[k]; throw e; });
    return packs[k];
  }
  function buffer(lang, id, key) {
    const k = `${lang}/${id}/${key}`;
    if (!buffers[k]) buffers[k] = pack(lang, id).then(p => { const c = Sound.ctx(); if (!c || !p[key]) throw new Error('no clip'); return decode(c, b64(p[key])); })
      .catch(e => { delete buffers[k]; throw e; });

  }

    token++;
    if (current) { const s = current; current = null; try { s.stop(); } catch (e) {} }
    try { synth && synth.cancel(); } catch (e) {}
  }
  function say(id, key, text, onend) {
    stop();
    const my = token, lang = state.lang;
    let done = false; const finish = () => { if (!done) { done = true; onend && onend(); } };
    if (!state.sound) { if (onend) setTimeout(finish, 700); return; }
    buffer(lang, id, key).then(buf => {
      if (my !== token) return finish();
      const c = Sound.ctx(), s = c.createBufferSource();
      s.buffer = buf; s.connect(Sound.voiceOut()); s.onended = () => { if (current === s) current = null; finish(); };
      current = s; s.start();

  }

})();

const synth = window.speechSynthesis;

if (synth) { loadVoices(); try { synth.addEventListener('voiceschanged', loadVoices); } catch (e) {} }

  const want = state.lang === 'ru' ? 'ru' : 'en';
  const list = voices.filter(v => (v.lang || '').toLowerCase().startsWith(want));
  return list.find(v => /natural|neural|premium|enhanced|google|siri/i.test(v.name)) || list[0] || null;
}

  if (!synth || !text) { setTimeout(finish, 700); return; }

  const n = Math.max(1, Math.round(d.len));
  const dietIcon = d.diet === 'fish' ? 'i-fish' : d.diet === 'meat' ? 'i-meat' : 'i-leaf';
  const stat = (cls, ic, label, value, sub) =>
    `<div class="stat ${cls}"><span class="stat-ico">${icon(ic)}</span><div class="stat-body"><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ''}</div></div>`;
  $('#view-dino').innerHTML = `
    <div class="detail-nav">
      <button class="btn" type="button" data-act="back">${icon('i-back')}<span>${tt.back}</span></button>
      <div class="pager">
        <button class="btn round" type="button" data-act="prev" aria-label="${tt.prev}">${icon('i-left')}</button>
        <span class="counter">${i + 1} / ${DINOS.length}</span>
        <button class="btn round" type="button" data-act="next" aria-label="${tt.next}">${icon('i-right')}</button>
      </div>
    </div>
    <div class="detail-grid">
      <div class="stage-col">
        <div class="stage" id="stage">
          ${scene(h)}
          <button class="stage-dino ${h}" id="stage-dino" type="button" data-act="roar" aria-label="${tt.roar}">${art(d.id)}</button>
          <span class="tap-me"${state.tapped ? ' hidden' : ''}>${icon('i-hand')}${tt.tapMe}</span>
        </div>
        <div class="name-block">
          <h1 class="dino-name"><button type="button" data-act="name">${l.name}</button></h1>
          <p class="meaning">${tt.quote(l.meaning)}</p>
        </div>
        <div class="actions">
          <button class="btn btn-sun" type="button" data-act="listen">${icon('i-speaker')}${tt.listen}</button>
          <button class="btn btn-lava" type="button" data-act="roar">${icon('i-roar')}${tt.roar}</button>
        </div>
      </div>
      <div class="info-col">
        <div class="stats">
          ${stat('eats-' + d.diet, dietIcon, tt.eats, tt.diet[d.diet])}
          ${stat('', 'i-clock', tt.when, tt.mya(d.mya), tt.era[d.era])}
          ${stat('', 'i-pin', tt.found, l.where)}
          ${stat('', 'i-weight', tt.weight, tt.weightVal(d.kg), weightCmp(d.kg))}
        </div>
        <div class="panel">
          <h2>${d.wings ? tt.wingTitle : tt.sizeTitle}</h2>
          <p>${d.wings ? tt.wingText(d.len, n) : tt.sizeText(d.len, n)}</p>
          <div class="kids" aria-hidden="true">${Array.from({ length: n }, () => icon('i-kid', '0 0 16 26')).join('')}</div>
        </div>
        <div class="panel">
          <h2>${tt.factsTitle}</h2>
          <ol class="facts">${l.facts.map((f, k) => `<li><button class="btn btn-sun say" type="button" data-act="say" data-i="${k}" aria-label="${tt.sayFact}">${icon('i-speaker')}</button><span>${f}</span></li>`).join('')}</ol>
        </div>
      </div>
    </div>`;
  bindSwipe();
}

function bindSwipe() {
  const st = $('#stage'); if (!st) return;
  let sx = null, sy = 0;
  st.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
  st.addEventListener('pointerup', e => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) step(dx < 0 ? 1 : -1);
  });
}

function renderGames() {
  const tiles = [
    ['find', `${art('trike', '', 'width:32%')}${art('stego', '', 'width:32%')}${art('trex', '', 'width:32%')}`],
    ['eat', `${art('trex', '', 'width:46%')}${ILL_PLANT}${ILL_MEAT}`],
    ['big', `${art('brachio', '', 'width:62%')}${art('compy', '', 'width:26%')}`]
  ];
  $('#view-games').innerHTML = `<div class="game-menu">${tiles.map(([g, pic]) =>
    `<button class="game-tile" type="button" data-act="game" data-g="${g}">
      <span class="game-art">${pic}</span>
      <span class="game-title">${t().g[g].title}</span>
      <span class="game-desc">${t().g[g].desc}</span></button>`).join('')}</div>`;
}

/* ---------- games ---------- */
function startGame(type) {
  state.game = { type, stars: 0, last: null, locked: false, won: false };
  go('play');
  newRound();
}
function newRound() {
  const g = state.game; g.locked = false; g.won = false;
  if (g.type === 'find') {
    const target = pickOne(DINOS, g.last);
    g.round = { target, options: shuffle([target, ...shuffle(DINOS.filter(d => d !== target)).slice(0, 2)]) };
  } else if (g.type === 'eat') {
    g.round = { target: pickOne(DINOS.filter(d => d.diet === 'plants' || d.diet === 'meat'), g.last) };
  } else {
    let a, b;
    do { [a, b] = shuffle(DINOS); } while (Math.max(a.kg, b.kg) / Math.min(a.kg, b.kg) < 4 || a === g.last || b === g.last);
    g.round = { options: [a, b], target: a.kg > b.kg ? a : b };
  }
  g.last = g.round.target;
  renderPlay();
  Voice.preload(['common', ...(g.round.options || [g.round.target]).map(d => d.id)]);
  sayPrompt();
}
function promptText() {
  const g = state.game, tt = t();
  if (g.type === 'find') return tt.whereIs(midName(g.round.target));
  if (g.type === 'eat') return tt.whatEats(midName(g.round.target));
  return tt.whoBigger;
}
function sayPrompt() {
  const g = state.game; if (!g) return;
  if (g.type === 'find') say(g.round.target.id, 'where', promptText());
  else if (g.type === 'eat') say(g.round.target.id, 'eats', promptText());
  else say('common', 'bigger', promptText());
}
function starsHTML(n) { return Array.from({ length: 5 }, (_, i) => `<svg viewBox="0 0 24 24" class="${i < n ? 'on' : ''}" aria-hidden="true"><use href="#i-star"/></svg>`).join(''); }
function playTop() {
  const g = state.game;
  return `<div class="play-top">
    <button class="btn" type="button" data-act="games">${icon('i-back')}<span>${t().games}</span></button>
    <div class="stars" id="stars" role="img" aria-label="${t().stars(g.stars)}">${starsHTML(g.stars)}</div></div>`;
}
function renderPlay() {
  const g = state.game, tt = t();
  if (g.won) return renderWin();
  let body = '';
  if (g.type === 'find') {
    body = `<div class="choices">${g.round.options.map((d, i) =>
      `<button class="choice ${habitat(d)}" type="button" data-act="choose" data-i="${i}" aria-label="${L(d).name}"><span class="ch-art">${art(d.id)}</span></button>`).join('')}</div>`;
  } else if (g.type === 'eat') {
    const d = g.round.target;
    body = `<div class="eat-hero"><span class="card-art ${habitat(d)}">${art(d.id, L(d).name)}</span></div>
      <div class="choices two">
        <button class="choice food" type="button" data-act="choose" data-i="plants"><span class="ch-art">${ILL_PLANT}</span><span class="ch-label">${tt.plants}</span></button>
        <button class="choice food meat" type="button" data-act="choose" data-i="meat"><span class="ch-art">${ILL_MEAT}</span><span class="ch-label">${tt.meat}</span></button>
      </div>`;
  } else {
    const [a, b] = g.round.options, big = Math.max(a.len, b.len);
    body = `<div class="choices two">${g.round.options.map((d, i) => {
      const s = d === g.round.target ? 1 : Math.max(0.38, Math.sqrt(d.len / big));
      return `<button class="choice ${habitat(d)}" type="button" data-act="choose" data-i="${i}" aria-label="${L(d).name}"><span class="ch-art big-art">${art(d.id, '', `transform:scale(${s.toFixed(2)})`)}</span><span class="ch-label">${cardName(d)}</span></button>`;
    }).join('')}</div>`;
  }
  $('#view-play').innerHTML = `${playTop()}
    <div class="prompt"><button class="btn btn-sun round" type="button" data-act="repeat" aria-label="${tt.repeat}">${icon('i-speaker')}</button><h2>${promptText()}</h2></div>${body}`;
}
function renderWin() {
  const g = state.game, tt = t();
  const d = g.winner || (g.winner = DINOS[Math.floor(Math.random() * DINOS.length)]);
  $('#view-play').innerHTML = `${playTop()}
    <div class="win"><div class="dance">${art(d.id, L(d).name)}</div>
    <h2>${tt.win}</h2><p>${tt.winSub}</p>
    <div class="win-actions">
      <button class="btn btn-leaf" type="button" data-act="again">${icon('i-star')}${tt.again}</button>
      <button class="btn" type="button" data-act="games">${icon('i-back')}${tt.other}</button>
    </div></div>`;
}
function choose(btn) {
  const g = state.game; if (!g || g.locked) return;
  const tt = t(), key = btn.dataset.i;
  let ok, yes, no;
  if (g.type === 'find') {
    const d = g.round.options[+key]; ok = d === g.round.target;
    yes = [d.id, 'yes', tt.yesThis(midName(d))]; no = [d.id, 'wrong', tt.wrongThis(midName(d))];
  } else if (g.type === 'eat') {
    const d = g.round.target; ok = key === d.diet;
    yes = [d.id, 'yesEats', tt.yesEats(sayName(d), d.diet)]; no = ['common', 'try', tt.tryAgain];
  } else {
    const d = g.round.options[+key]; ok = d === g.round.target;
    yes = [d.id, 'big', tt.yesBigger(sayName(d))]; no = ['common', 'wrongBig', tt.wrongBigger];
  }
  if (!ok) {
    btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope');
    Sound.play('wrong'); say(no[0], no[1], no[2]); return;
  }
  g.locked = true; g.stars++;
  btn.classList.add('right');
  const st = $('#stars'); if (st) { st.innerHTML = starsHTML(g.stars); st.setAttribute('aria-label', tt.stars(g.stars)); }
  Sound.play('success'); confetti(28);
  say(yes[0], yes[1], yes[2], () => setTimeout(() => {
    if (state.view !== 'play' || state.game !== g) return;
    if (g.stars >= 5) { g.won = true; renderWin(); Sound.play('fanfare'); confetti(70); say('common', 'win', tt.winSay); }
    else newRound();
  }, 350));
}

function confetti(n) {
  if (reduced) return;
  const box = $('#confetti'), colors = ['var(--sun)', 'var(--lava)', 'var(--leaf)', 'var(--blue)', 'var(--pink)'];
  for (let i = 0; i < n; i++) {
    const e = document.createElement('i');
    e.style.left = (Math.random() * 100) + '%';
    e.style.background = colors[i % colors.length];
    e.style.animationDelay = (Math.random() * 0.4) + 's';
    e.style.width = (8 + Math.random() * 8) + 'px';
    e.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    box.appendChild(e);
    setTimeout(() => e.remove(), 2500);
  }
}

/* ---------- navigation ---------- */
function go(view, opts = {}) {
  state.view = view;
  ['list', 'dino', 'games', 'play'].forEach(v => { $('#view-' + v).hidden = v !== view; });
  if (view === 'list') renderList();
  if (view === 'dino') renderDino();
  if (view === 'games') { renderGames(); state.game = null; }
  renderStatic();
  if (!opts.keepScroll) window.scrollTo(0, 0);
}
function openDino(id) {
  state.dinoId = id; go('dino');
  Voice.preload([id]);
  say(id, 'name', sayName(byId(id)));
}
function step(dir) {
  const i = DINOS.findIndex(d => d.id === state.dinoId);
  const d = DINOS[(i + dir + DINOS.length) % DINOS.length];
  Sound.play('pop');
  state.dinoId = d.id; go('dino', { keepScroll: true });
  say(d.id, 'name', sayName(d));
}
function roar() {
  const d = byId(state.dinoId), el = $('#stage-dino'); if (!el) return;
  el.classList.remove('roaring'); void el.offsetWidth; el.classList.add('roaring');
  Sound.play(d.sound, d.pitch);
  state.tapped = true;
  const tm = $('.tap-me'); if (tm) tm.hidden = true;
  const stage = $('#stage'), old = stage.querySelector('.bubble'); if (old) old.remove();
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = t().bubble[d.sound];
  stage.appendChild(b); setTimeout(() => b.remove(), 1300);
}
function setLang(lang) {
  if (lang === state.lang) return;
  state.lang = lang; STORE.set('dino-lang', lang); hush();
  if (state.view === 'play' && state.game) { renderStatic(); renderPlay(); if (!state.game.won) sayPrompt(); }
  else go(state.view, { keepScroll: true });
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  Sound.unlock();
  const act = b.dataset.act;
  if (b.id === 'lang-en' || b.id === 'lang-ru') { Sound.play('pop'); return setLang(b.dataset.lang); }
  if (b.id === 'sound') { state.sound = !state.sound; STORE.set('dino-sound', state.sound ? '1' : '0'); if (!state.sound) hush(); else Sound.play('pop'); return renderStatic(); }
  if (b.id === 'tab-dinos' || b.id === 'brand') { Sound.play('pop'); hush(); return go('list'); }
  if (b.id === 'tab-games') { Sound.play('pop'); hush(); return go('games'); }
  switch (act) {
    case 'filter': Sound.play('pop'); state.filter = b.dataset.f; renderList(); break;
    case 'open': Sound.play('pop'); openDino(b.dataset.id); break;
    case 'back': Sound.play('pop'); hush(); go('list'); break;
    case 'prev': step(-1); break;
    case 'next': step(1); break;
    case 'roar': roar(); break;
    case 'name': say(state.dinoId, 'name', sayName(byId(state.dinoId))); break;
    case 'listen': say(state.dinoId, 'hi', L(byId(state.dinoId)).hi); break;
    case 'say': say(state.dinoId, 'f' + b.dataset.i, L(byId(state.dinoId)).facts[+b.dataset.i]); break;
    case 'game': Sound.play('pop'); Voice.preload(['common']); startGame(b.dataset.g); break;
    case 'games': Sound.play('pop'); hush(); go('games'); break;
    case 'repeat': sayPrompt(); break;
    case 'choose': choose(b); break;
    case 'again': Sound.play('pop'); startGame(state.game ? state.game.type : 'find'); break;
  }
});
document.addEventListener('keydown', e => {
  if (state.view !== 'dino') return;
  if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'Escape') go('list');
});

/* ---------- start ---------- */
function start(data) {
  data = data || {};
  const nav = (navigator.language || '').slice(0, 2).toLowerCase();
  state.lang = data.lang || STORE.get('dino-lang') || (['ru', 'kk', 'uk', 'be'].includes(nav) ? 'ru' : 'en');
  state.sound = STORE.get('dino-sound') !== '0';
  state.filter = data.filter || 'all';
  const hash = (location.hash || '').slice(1);
  const id = data.dinoId || (byId(hash) ? hash : null);
  if (data.view === 'dino' && id) { state.dinoId = id; go('dino'); }
  else if (!data.view && byId(hash)) { state.dinoId = hash; go('dino'); }
  else if (data.view === 'games' || hash === 'games') go('games');
  else go('list');
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ lang: state.lang, view: state.view === 'play' ? 'games' : state.view, dinoId: state.dinoId, filter: state.filter }));
} catch (e) {}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();

</script>
</body>
</html>
